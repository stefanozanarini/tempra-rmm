<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" role="img" aria-label="Tempra RMM">
  <title>TEMPRA RMM</title>
  <desc>Logo TEMPRA RMM con scudo e monitor azzurro, orbita e battito rossi, scritta TEMPRA bianca e RMM rossa. Sfondo trasparente.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BF0"/>
      <stop offset="1" stop-color="#3D6FC4"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4A4F"/>
      <stop offset="1" stop-color="#D90012"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M275 45 L465 112 L451 300 Q434 424 275 510 Q116 424 99 300 L85 112 Z"
        fill="none" stroke="url(#navy)" stroke-width="24" stroke-linejoin="round"/>
  <!-- Monitor -->
  <rect x="153" y="160" width="245" height="190" rx="20" fill="none" stroke="url(#navy)" stroke-width="16"/>
  <path d="M263 352 L263 390 L220 390 M263 390 L322 390" fill="none" stroke="url(#navy)" stroke-width="15" stroke-linecap="round"/>
  <!-- ECG -->
  <path d="M181 254 H218 L235 238 L252 275 L274 195 L299 286 L320 237 L337 254 H372"
        fill="none" stroke="url(#red)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Orbit and node -->
  <path d="M58 365 C122 458 287 392 432 258 C486 208 499 143 450 120"
        fill="none" stroke="url(#red)" stroke-width="22" stroke-linecap="round"/>
  <path d="M446 119 C482 128 494 164 477 203" fill="none" stroke="url(#red)" stroke-width="17" stroke-linecap="round"/>
  <circle cx="442" cy="231" r="29" fill="url(#red)"/>
  <circle cx="442" cy="231" r="10" fill="#FFFFFF"/>
  <!-- vertical separator -->
  <path d="M535 150 V385" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="590" y="330" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="164" font-weight="900" font-style="italic" letter-spacing="-8">TEMPRA</text>
  <text x="1350" y="330" fill="url(#red)" font-family="Arial, Helvetica, sans-serif" font-size="164" font-weight="900" font-style="italic" letter-spacing="-7">RMM</text>
</svg>
